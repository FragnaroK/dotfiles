# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty
#
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL version
env = SDL_VIDEODRIVER,wayland
# env = SDL_VIDEODRIVER,x11

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Uncomment in case you have issues with screensharing
# exec-once = ~/.config/hypr/scripts/xdg.sh

# Load hyprpm plugins
exec-once = hyprpm reload

# SSH Setup
exec-once = ~/.config/hypr/scripts/load-ssh.sh

# Setup monitors based on chassis type
exec-once = ~/.config/hypr/scripts/setup-env.sh

# --- Plugins configuration ---
plugin:dynamic-cursors {
    enabled = true
    mode = stretch

        stretch {

        # controls how much the cursor is stretched
        # this value controls at which speed (px/s) the full stretch is reached
        # the full stretch being twice the original length
        limit = 3000

        # relationship between speed and stretch amount, supports these values:
        # linear             - a linear function is used
        # quadratic          - a quadratic function is used
        # negative_quadratic - negative version of the quadratic one, feels more aggressive
        # see `activation` in `src/mode/utils.cpp` for how exactly the calculation is done
        function = quadratic

        # time window (ms) over which the speed is calculated
        # higher values will make slow motions smoother but more delayed
        window = 100
    }

    shake {
        enabled = false
    }
}

# Auto start
exec-once = ~/.config/ml4w/settings/terminal.sh